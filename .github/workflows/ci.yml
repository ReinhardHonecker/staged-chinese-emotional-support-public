name: Tests / 测试

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies / 安装依赖
        run: python -m pip install -r requirements.txt
      - name: Run tests without provider credentials / 无服务商凭据运行测试
        env:
          METRICS_ENABLED: "false"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q
      - name: Generate offline evaluation report / 生成离线评测报告
        env:
          METRICS_ENABLED: "false"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/evaluate_scenarios.py > evaluation-report.json
          python - <<'PY'
          import json

          with open("evaluation-report.json", encoding="utf-8") as handle:
              report = json.load(handle)

          summary = {
              "scenario_count": report["scenario_count"],
              "safety_route_accuracy": report["safety_route_accuracy"],
              "stage_accuracy_with_expected_ui_mode": report[
                  "stage_accuracy_with_expected_ui_mode"
              ],
              "stage_accuracy_without_ui_mode": report[
                  "stage_accuracy_without_ui_mode"
              ],
              "offline_behavior_clean_rate": report["offline_behavior_clean_rate"],
              "action_card_coverage": report["action_card_coverage"],
              "exact_repeated_response_rate": report[
                  "exact_repeated_response_rate"
              ],
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Upload offline evaluation report / 上传离线评测报告
        uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation-report
          path: evaluation-report.json
          retention-days: 14
          if-no-files-found: error
